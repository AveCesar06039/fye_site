{% extends "base.html" %}
{% block title %}Eliminar miembro{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-6 text-red-400">Eliminar miembro</h1>

<p class="mb-4 text-gray-300">
  ¿Seguro que deseas eliminar al miembro <strong>{{ object }}</strong>?  
  Esta acción no se puede deshacer.
</p>

<form method="post">
  {% csrf_token %}
  <button class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded">Confirmar</button>
  <a href="{% url 'miembros:list' %}" class="ml-4 underline">Cancelar</a>
</form>
{% endblock %}
